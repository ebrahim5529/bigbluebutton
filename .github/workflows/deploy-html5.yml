name: Deploy HTML5 Client

on:
  push:
    branches: [v3.0.x-develop]
    paths:
      - 'bigbluebutton-html5/**'
  workflow_dispatch:

concurrency:
  group: bbb-html5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/bbb
            git pull origin v3.0.x-develop

            cd bigbluebutton-html5
            npm ci --no-progress
            npm run build
            npm run build-safari
            bash deploy.sh --safari
